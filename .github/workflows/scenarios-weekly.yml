# Turns the week's news surges into ready-made Scenarios and opens a PR with them.
#
# 1. Refresh the storyboard (GDELT) and match its surges to nearby refineries, ports, LNG terminals,
#    fields, big power plants, cable landings and chokepoints (pipeline/live/story_scenarios.py).
# 2. Validate the file and open (or update) a PR on branch claude/scenarios-weekly for a person
#    to merge. Merging to main redeploys Pages, and the page shows the items under
#    "In the news" (this week, month and year) in the Scenarios panel.
#
# The Claude review is not part of this workflow. The model gateway (LiteLLM) is only reachable
# over the University of Michigan VPN, so tools/review_scenarios.sh runs on the owner's machine
# from a systemd user timer: it reviews the open PR's file with Claude Code, pushes the edit to
# the PR branch and adds its notes to the PR body. When the VPN or the machine is off, the PR
# simply stays unreviewed; nothing here waits for it.
#
# Opening the PR needs Settings → Actions → General → "Allow GitHub Actions to create and approve
# pull requests". With that off, the branch is still pushed and tools/review_scenarios.sh opens the
# PR with the owner's gh login on its next run; the job only fails if the branch didn't get pushed.
name: Weekly news scenarios

on:
  schedule:
    - cron: "23 6 * * 1"   # Mondays 06:23 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: scenarios-weekly
  cancel-in-progress: true

jobs:
  scenarios:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # read-only: reuse the Pages job's GDELT cache and last snapshots so the story fetch is incremental.
      # The path list must match pages.yml exactly (it is part of the cache version); nothing here is committed.
      - uses: actions/cache/restore@v4
        with:
          path: |
            raw/live_cache
            site/data/live
            raw/infra/peeringdb_fac.json
            raw/infra/_fetch.json
          key: live-${{ github.run_id }}
          restore-keys: live-

      - name: Refresh storyboard
        continue-on-error: true
        run: python3 -I pipeline/live/fetch_live.py --only story

      - name: Match surges to facilities
        run: python3 -I pipeline/live/story_scenarios.py

      - name: Validate
        run: |
          python3 -I pipeline/live/story_scenarios.py --check
          node --test tests/presets.test.mjs
          {
            echo "Scenarios generated from this week's GDELT storyboard surges by \`pipeline/live/story_scenarios.py\`."
            echo
            echo "Claude review: pending. \`tools/review_scenarios.sh\` runs on the owner's machine over the VPN and adds its notes here; until then, check each item yourself. The matching is keyword-based, so expect some noise."
            echo
            echo "Check the labels and shocks, then open the Scenarios panel locally to try them."
            echo
            echo "🤖 Generated with [Claude Code](https://claude.com/claude-code)"
          } > "$RUNNER_TEMP/pr-body.md"

      - uses: peter-evans/create-pull-request@v7
        id: cpr
        continue-on-error: true
        with:
          branch: claude/scenarios-weekly
          delete-branch: true
          add-paths: site/data/scenarios_weekly.json
          commit-message: |
            Update this week's news scenarios

            Co-Authored-By: Claude Code <noreply@anthropic.com>
          title: "Weekly news scenarios"
          body-path: ${{ runner.temp }}/pr-body.md

      - name: Check the branch was pushed
        if: steps.cpr.outcome == 'failure'
        run: |
          # create-pull-request pushes before it asks for the PR; a refusal to open the PR is fine
          # (review_scenarios.sh opens it), a branch that never reached GitHub is not.
          git ls-remote --exit-code --heads origin claude/scenarios-weekly
          echo "Branch claude/scenarios-weekly pushed; GitHub Actions may not open PRs here, so tools/review_scenarios.sh opens it (or open it by hand: https://github.com/${{ github.repository }}/compare/main...claude/scenarios-weekly)." >> "$GITHUB_STEP_SUMMARY"
