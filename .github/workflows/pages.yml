# Publishes site/ to GitHub Pages and refreshes the live snapshots (fires, conflict
# reports, storyboard, ships, US Navy tracker, military aircraft, business jets, airliners) every 30 minutes. GitHub delays or
# drops scheduled runs under load, so expect gaps of an hour or more now and then. A run takes ~14 min
# (ships listen 4 min, business jets take 3, airliners 6), so this is ~20,000 Actions minutes a month: free on a public repo, too much for a private one. Static layers in site/data/ are committed;
# site/data/live/ is generated here and never committed.
#
# One-time setup: Settings → Pages → Source: "GitHub Actions".
# Optional: Settings → Secrets and variables → Actions → AISSTREAM_API_KEY (free key from
# aisstream.io) for worldwide ships; without it the ships layer falls back to the Baltic
# feed. Warship positions (USNI) are global and need no key.
# PeeringDB data centres are merged into the deployed datacenters.geojson here and never committed
# (the repo copy stays OSM-only). Optional secret PEERINGDB_API_KEY raises PeeringDB's anonymous rate limit.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "7,37 * * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install websockets

      # GDELT 15-minute files and the previous snapshots, so each run only downloads what's new
      - uses: actions/cache/restore@v4
        with:
          path: |
            raw/live_cache
            site/data/live
            raw/infra/peeringdb_fac.json
            raw/infra/_fetch.json
          key: live-${{ github.run_id }}
          restore-keys: live-

      - name: Fetch live snapshots
        continue-on-error: true
        env:
          AISSTREAM_API_KEY: ${{ secrets.AISSTREAM_API_KEY }}
        run: python3 -I pipeline/live/fetch_live.py

      # Refetched at most once a day (step 5 reuses a download under 24 h old); on failure the OSM-only file ships
      - name: Add PeeringDB data centres
        continue-on-error: true
        env:
          PEERINGDB_API_KEY: ${{ secrets.PEERINGDB_API_KEY }}
        run: python3 -I pipeline/step5_defense_infra.py --only=datacenters --with-peeringdb --no-osm

      # Saved even if the Pages steps below fail: the AIS ship-type cache builds up across runs
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: |
            raw/live_cache
            site/data/live
            raw/infra/peeringdb_fac.json
            raw/infra/_fetch.json
          key: live-${{ github.run_id }}

      # Lets a dev pull the latest snapshots without the API keys: gh run download -n live-data -D site/data/live
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-data
          path: site/data/live
          retention-days: 3

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
